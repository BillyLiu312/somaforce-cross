task: push_pull_box
robot:
  type: unitree_g1
  joint_order: g1_29dof_sonic_mujoco_order
scaffold:
  provider: legacy_sonic_baseline
  command_name: motion
  input: motion_trajectory
  output: a_nom
  action_clip: 20.0
trajectory:
  source: procedural_g1_box_legacy
  default_mode: push
  supported_modes:
    - push
    - pull
  sonic_motion_keys:
    push: somaforce_g1_box_push
    pull: somaforce_g1_box_pull
  num_frames: 80
  duration_s: 2.0
sonic_manager_env:
  binding: scaffold_motion_plus_rigid_object
  add_object: true
  requires_articulation_scene: false
  box_usd_path: null
  object_position: [0.72, 0.0, 0.75]
  object_mass: 2.0
scene:
  object_type: rigid_box
  interaction_modes:
    - push
    - pull
  mismatch_sources:
    - box_pose_error
    - friction_variation
    - initial_stance_reach_stress
references:
  nominal_refs:
    - nominal_joint_pos
    - nominal_hand_ref
    - nominal_body_ref
