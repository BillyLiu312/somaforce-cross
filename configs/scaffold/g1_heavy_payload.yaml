task: heavy_payload
robot:
  type: unitree_g1
  joint_order: g1_29dof_hdmi_order
scaffold:
  provider: hdmi
  input: canonical_reference_episode
  output: a_nom
  action_clip: 20.0
reference:
  source: omomo_retargeted
  schema_version: 1
  rate_hz: 50
  required_fields:
    - joint_pos
    - joint_vel
    - body_pos_w
    - body_quat_w
    - hand_pose_w
    - object_root_pose_w
    - contact_target_obj
    - contact_intent
    - contact_confidence
    - reference_valid
    - phase
retarget:
  mode: joint_human_object_to_g1
  preserve_wrist_object_transform: true
  require_stance_contact: true
  reject_joint_limit_violation: true
  mask_low_confidence_contact: true
scene:
  object_type: rigid_heavy_payload
  interaction_modes:
    - lift_carry_place
  mismatch_sources:
    - payload_mass_error
    - payload_com_error
    - bilateral_load_share_error
    - grasp_transform_error
force_labels:
  source: isaac_lab_rollout
  infer_from_omomo_kinematics: false
