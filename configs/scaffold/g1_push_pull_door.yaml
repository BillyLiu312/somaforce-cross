task: push_pull_door
robot:
  type: unitree_g1
  joint_order: g1_29dof_sonic_mujoco_order
scaffold:
  provider: sonic
  command_name: motion
  input: motion_trajectory
  output: a_nom
  action_clip: 20.0
trajectory:
  source: procedural_g1_door
  default_mode: push
  supported_modes:
    - push
    - pull
  num_frames: 80
  duration_s: 2.0
scene:
  object_type: articulated_door
  interaction_modes:
    - push
    - pull
  mismatch_sources:
    - hinge_axis_error
    - handle_pose_error
    - friction_damping_variation
references:
  nominal_refs:
    - nominal_joint_pos
    - nominal_hand_ref
    - nominal_body_ref
