task: push_pull_door
robot:
  type: unitree_g1
  joint_order: g1_29dof_sonic_mujoco_order
scaffold:
  provider: sonic
  command_name: motion
  input: motion_trajectory
  output: a_nom
  action_clip: 20.0
trajectory:
  source: procedural_g1_door
  default_mode: push
  supported_modes:
    - push
    - pull
  sonic_motion_keys:
    push: somaforce_g1_door_push
    pull: somaforce_g1_door_pull
  num_frames: 80
  duration_s: 2.0
sonic_manager_env:
  binding: scaffold_motion_plus_articulated_door
  add_object: false
  requires_articulation_scene: true
  door_asset_path: null
scene:
  object_type: articulated_door
  interaction_modes:
    - push
    - pull
  mismatch_sources:
    - hinge_axis_error
    - handle_pose_error
    - friction_damping_variation
references:
  nominal_refs:
    - nominal_joint_pos
    - nominal_hand_ref
    - nominal_body_ref
