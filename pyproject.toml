[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "somaforce-cross"
version = "0.1.0"
description = "SomaForce-Cross scaffold and force-semantic engineering baseline."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "torch",
]

[tool.setuptools.packages.find]
include = ["somaforce_cross*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
